[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alextym-workforce-intelligence"
version = "0.1.0"
description = "Embedded synthetic Workforce Intelligence PoC for Portfolio Lab."
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1,<1.0",
    "fastapi>=0.138.1,<1.0",
    "openpyxl>=3.1.5,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["workforce_intelligence", "workforce_intelligence.*"]
