[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alextym-fleet-hub"
version = "0.1.0"
description = "Embedded Fleet VOR Hub API and data for alextym.com."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.1,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fleet_hub", "fleet_hub.*"]

[tool.setuptools.package-data]
"fleet_hub.services" = ["vor_seed.sqlite3"]
