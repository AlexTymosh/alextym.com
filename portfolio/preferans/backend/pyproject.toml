[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alextym-preferans"
version = "0.1.0"
description = "Private Preferans backend domain and secured room API."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.138.1,<1.0", "firebase-admin>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["preferans", "preferans.*"]
